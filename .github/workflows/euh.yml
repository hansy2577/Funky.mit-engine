name: Bundle to Single HTML File

on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inline HTML, CSS, and JS
        uses: ntsk/html-inline-actions@v1.2.0
        with:
          path: /dist/index.html
          prefix: 'inlined-'
    
      - name: Upload Single File Artifact
        uses: actions/upload-artifact@v4
        with:
          name: single-html-page
          path: /dist/index.html
