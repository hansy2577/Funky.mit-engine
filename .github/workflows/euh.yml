name: Compile Funkin.mit Engine to 1 File

on:
  workflow_dispatch:

permissions:
  contents: read
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Inliner Tool
        run: npm install -g posthtml-cli posthtml-inline-assets

      - name: Compile HTML JS CSS into Single File
        # Remplacez "index.html" par le nom du fichier HTML principal de votre moteur
        run: |
          mkdir -p build
          posthtml mobile.html -o build/mobile.html -u posthtml-inline-assets

      - name: Upload Single File Game Artifact
        uses: actions/upload-artifact@v4
        with:
          name: funkin-mit-single-file
          path: build/index.html
